[build-system]
requires = ["flit_core >= 3.12.0, <4"]
build-backend = "flit_core.buildapi"

[project]
name = "propinquity"
version = '2.0.dev1'
description = "Workflow for building synthetic phylogenetic trees for the Open Tree of Life project"

authors = [
  { name="Mark Holder", email="mtholder@gmail.com" },
  { name="Ben D. Redelings"},
]
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
license = "BSD-2-Clause"
license-files = ["LICENSE.md"]

[project.urls]
Homepage = "https://github.com/OpenTreeOfLife/propinquity"
Issues = "https://github.com/OpenTreeOfLife/propinquity/issues"
